name: Supabase database migration
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify or apply a checked-in migration
        required: true
        default: verify
        type: choice
        options: [verify, apply]
      migration:
        description: Checked-in migration target
        required: true
        default: candidate_hiring
        type: choice
        options: [candidate_hiring, unsaved_previews, account_usernames, general_links, ai_scoring]
permissions:
  contents: read
concurrency:
  group: training-app-supabase-schema
  cancel-in-progress: false
jobs:
  candidate-hiring:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify or apply the checked-in migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPERATION: ${{ inputs.operation }}
          MIGRATION: ${{ inputs.migration }}
        run: python3 scripts/supabase-candidate-migration.py
